name: Build and Validate

on:
  push:
    branches:
      - main
      - develop

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Determinar ambiente
        id: set-env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "ENVIRONMENT=production" >> $GITHUB_ENV
            echo "FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID_PROD }}" >> $GITHUB_ENV
            echo "FIREBASE_CREDENTIALS=${{ secrets.FIREBASE_CREDENTIALS_PROD }}" >> $GITHUB_ENV
          else
            echo "ENVIRONMENT=develop" >> $GITHUB_ENV
            echo "FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID_DEV }}" >> $GITHUB_ENV
            echo "FIREBASE_CREDENTIALS=${{ secrets.FIREBASE_CREDENTIALS_DEV }}" >> $GITHUB_ENV
          fi

      - name: Configurar Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache do Maven
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Build do projeto com Maven
        run: mvn clean package -DskipTests

      - name: Build Docker image
        run: |
          docker build -t consultalicitacao:${{ env.ENVIRONMENT }} \
            --build-arg FIREBASE_PROJECT_ID="${{ env.FIREBASE_PROJECT_ID }}" \
            --build-arg SPRING_PROFILES_ACTIVE="${{ env.ENVIRONMENT }}" \
            .
